services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: helpdesk_db
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: HelpDesk Pro
      ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://helpdesk:change_me@db:5432/helpdesk_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the environment}
      ACCESS_TOKEN_MINUTES: "15"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: /app/private_uploads
      MAX_UPLOAD_SIZE_MB: "5"
    volumes:
      - uploads:/app/private_uploads
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://helpdesk:change_me@db:5432/helpdesk_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the environment}
      UPLOAD_DIR: /app/private_uploads
    command: python -m app.tasks.scheduler
    restart: unless-stopped

  # Uncomment when a real task queue (Celery/Redis) is introduced.
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped

volumes:
  uploads:
  pgdata: