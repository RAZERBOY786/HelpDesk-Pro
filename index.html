<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <title>HelpDesk Pro</title>
    <meta name="theme-color" content="#f8f9ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 12% 18%, rgba(123, 160, 255, 0.28), transparent 42%),
          radial-gradient(circle at 88% 82%, rgba(181, 139, 255, 0.26), transparent 40%),
          radial-gradient(circle at 78% 18%, rgba(127, 216, 255, 0.2), transparent 36%),
          #fbfaff;
        overflow: hidden;
        transition: opacity 0.5s ease;
      }
      html.dark #app-preloader {
        background:
          radial-gradient(circle at 12% 18%, rgba(123, 160, 255, 0.16), transparent 42%),
          radial-gradient(circle at 88% 82%, rgba(181, 139, 255, 0.14), transparent 40%),
          radial-gradient(circle at 78% 18%, rgba(127, 216, 255, 0.1), transparent 36%),
          #0a0a0b;
      }
      #app-preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Drifting ambient orbs behind the loader. */
      .preloader-orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        opacity: 0.55;
        pointer-events: none;
        will-change: transform;
      }
      .preloader-orb--a {
        width: 460px;
        height: 460px;
        top: -140px;
        left: -100px;
        background: radial-gradient(circle at 35% 35%, #7ba0ff, transparent 68%);
        animation: preloader-orb-a 20s ease-in-out infinite;
      }
      .preloader-orb--b {
        width: 380px;
        height: 380px;
        bottom: -120px;
        right: -80px;
        background: radial-gradient(circle at 60% 40%, #b58bff, transparent 68%);
        animation: preloader-orb-b 26s ease-in-out infinite;
      }
      .preloader-orb--c {
        width: 320px;
        height: 320px;
        top: 38%;
        left: 46%;
        background: radial-gradient(circle at 50% 50%, #7fd8ff, transparent 68%);
        animation: preloader-orb-c 32s ease-in-out infinite;
      }
      html.dark .preloader-orb {
        opacity: 0.3;
      }

      /* Card-free layout — content floats directly over the ambient glow.
         Children rise in sequence on load. */
      .app-preloader-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: preloader-glass-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .app-preloader-inner > * {
        animation: preloader-glass-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .app-preloader-inner > *:nth-child(1) {
        animation-delay: 0.04s;
      }
      .app-preloader-inner > *:nth-child(2) {
        animation-delay: 0.1s;
      }
      .app-preloader-inner > *:nth-child(3) {
        animation-delay: 0.16s;
      }
      .app-preloader-inner > *:nth-child(n + 4) {
        animation-delay: 0.22s;
      }

      /* Soft breathing halo behind the logo. */
      .preloader-halo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 560px;
        height: 560px;
        border-radius: 9999px;
        background: radial-gradient(
          circle,
          rgba(124, 58, 237, 0.16),
          rgba(29, 78, 216, 0.1) 45%,
          transparent 70%
        );
        filter: blur(40px);
        pointer-events: none;
        animation: preloader-halo-pulse 4s ease-in-out infinite;
      }

      /* Floating frosted-glass accent chips — visual depth without any card. */
      .preloader-chip {
        position: absolute;
        z-index: 1;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 8px 24px -12px rgba(49, 40, 130, 0.35);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        pointer-events: none;
      }
      html.dark .preloader-chip {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.7);
      }
      .preloader-chip--a {
        width: 96px;
        height: 96px;
        top: 30%;
        left: 18%;
        animation: preloader-chip-a 9s ease-in-out infinite;
      }
      .preloader-chip--b {
        width: 64px;
        height: 64px;
        top: 20%;
        right: 22%;
        animation: preloader-chip-b 11s ease-in-out infinite;
      }
      .preloader-chip--c {
        width: 46px;
        height: 46px;
        bottom: 24%;
        left: 26%;
        animation: preloader-chip-c 13s ease-in-out infinite;
      }
      .preloader-chip--d {
        width: 36px;
        height: 36px;
        bottom: 32%;
        right: 28%;
        animation: preloader-chip-d 10s ease-in-out infinite;
      }

      /* Logo chip with a floating + spinning ring. */
      .preloader-logo {
        position: relative;
        width: 76px;
        height: 76px;
        z-index: 1;
        animation: preloader-float 3.2s ease-in-out infinite;
      }
      .preloader-logo::after {
        content: '';
        position: absolute;
        inset: -16px;
        border-radius: 9999px;
        background: radial-gradient(
          circle,
          rgba(29, 78, 216, 0.3),
          rgba(124, 58, 237, 0.18) 55%,
          transparent 72%
        );
        filter: blur(14px);
      }
      .preloader-logo svg {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 22px;
        filter: drop-shadow(0 10px 22px rgba(60, 40, 160, 0.35));
      }
      .preloader-logo-ring {
        position: absolute;
        inset: -12px;
        border-radius: 9999px;
        border: 1.5px solid rgba(124, 58, 237, 0.35);
        border-top-color: rgba(29, 78, 216, 0.9);
        animation: preloader-spin 2.4s linear infinite;
      }
      html.dark .preloader-logo-ring {
        border-color: rgba(255, 255, 255, 0.18);
        border-top-color: rgba(123, 160, 255, 0.9);
      }

      /* Brand. */
      .preloader-brand {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 24px;
        letter-spacing: -0.02em;
        color: #17131f;
        margin: 0;
        line-height: 1.1;
      }
      html.dark .preloader-brand {
        color: #f5f5f6;
      }
      .preloader-brand span {
        background: linear-gradient(90deg, #1d4ed8, #6d28d9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .preloader-tagline {
        font-family: Inter, system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        color: #767185;
        margin: 0;
      }
      html.dark .preloader-tagline {
        color: #8c8c90;
      }

      /* Shimmering blue-to-purple progress bar. */
      .preloader-bar {
        width: 210px;
        height: 7px;
        border-radius: 9999px;
        overflow: hidden;
        background: rgba(29, 78, 216, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 1px 2px rgba(30, 20, 90, 0.12);
      }
      html.dark .preloader-bar {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .preloader-bar > span {
        position: relative;
        display: block;
        height: 100%;
        width: 42%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #1d4ed8, #6d28d9, #1d4ed8);
        background-size: 200% 100%;
        animation: preloader-bar-fill 1.3s ease-in-out infinite;
      }
      .preloader-bar > span::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        animation: preloader-bar-sheen 1.3s ease-in-out infinite;
      }

      /* Status line. */
      .preloader-status {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .preloader-dot {
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background: linear-gradient(135deg, #1d4ed8, #6d28d9);
        animation: preloader-dot-pulse 1.4s ease-in-out infinite;
      }
      .preloader-text {
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: #4a4557;
        margin: 0;
      }
      html.dark .preloader-text {
        color: #c7c7ca;
      }

      @keyframes preloader-orb-a {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(60px, 45px, 0) scale(1.12);
        }
      }
      @keyframes preloader-orb-b {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1.05);
        }
        50% {
          transform: translate3d(-70px, -55px, 0) scale(0.92);
        }
      }
      @keyframes preloader-orb-c {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(45px, -65px, 0) scale(1.16);
        }
      }
      @keyframes preloader-glass-in {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes preloader-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes preloader-bar-fill {
        0% {
          width: 30%;
          transform: translateX(-110%);
        }
        50% {
          width: 70%;
        }
        100% {
          width: 30%;
          transform: translateX(360%);
        }
      }
      @keyframes preloader-bar-sheen {
        0% {
          transform: translateX(-150%);
        }
        100% {
          transform: translateX(420%);
        }
      }
      @keyframes preloader-dot-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      @keyframes preloader-halo-pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.06);
        }
      }
      @keyframes preloader-chip-a {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(30px, -26px) rotate(18deg);
        }
      }
      @keyframes preloader-chip-b {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(-28px, 30px) rotate(-22deg);
        }
      }
      @keyframes preloader-chip-c {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(34px, -20px) rotate(26deg);
        }
      }
      @keyframes preloader-chip-d {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        50% {
          transform: translate(-24px, -28px) rotate(-18deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-preloader-inner,
        .app-preloader-inner > *,
        .preloader-halo,
        .preloader-chip,
        .preloader-orb,
        .preloader-logo,
        .preloader-logo-ring,
        .preloader-bar > span,
        .preloader-bar > span::after,
        .preloader-dot {
          animation: none;
        }
        .preloader-halo {
          transform: translate(-50%, -50%);
        }
        .preloader-logo-ring {
          border-color: rgba(124, 58, 237, 0.35);
        }
        .preloader-bar > span {
          width: 100%;
        }
        .preloader-bar > span::after {
          display: none;
        }
      }
    </style>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('helpdesk-theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app-preloader" role="status" aria-label="Loading HelpDesk Pro">
      <div class="preloader-orb preloader-orb--a"></div>
      <div class="preloader-orb preloader-orb--b"></div>
      <div class="preloader-orb preloader-orb--c"></div>
      <div class="preloader-halo"></div>
      <span class="preloader-chip preloader-chip--a"></span>
      <span class="preloader-chip preloader-chip--b"></span>
      <span class="preloader-chip preloader-chip--c"></span>
      <span class="preloader-chip preloader-chip--d"></span>
      <div class="app-preloader-inner">
        <div class="preloader-logo">
          <span class="preloader-logo-ring"></span>
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="preloader-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1d4ed8" />
                <stop offset="1" stop-color="#6d28d9" />
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="18" fill="url(#preloader-grad)" />
            <rect x="4" y="4" width="18" height="26" rx="9" fill="#ffffff" opacity="0.5" />
            <path d="M19 33v-3a13 13 0 0 1 26 0v3" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
            <rect x="15" y="31" width="7.5" height="13" rx="3.75" fill="#ffffff" />
            <rect x="41.5" y="31" width="7.5" height="13" rx="3.75" fill="#ffffff" />
            <path d="M45.25 44c0 4.4-4.3 6.5-9.75 6.5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
            <circle cx="33" cy="50.5" r="3.2" fill="#ffffff" />
          </svg>
        </div>
        <h1 class="preloader-brand">HelpDesk <span>Pro</span></h1>
        <p class="preloader-tagline">Employee Self-Service Desk</p>
        <div class="preloader-bar"><span></span></div>
        <div class="preloader-status">
          <span class="preloader-dot"></span>
          <span class="preloader-text">Preparing your workspace…</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      ;(function () {
        var el = document.getElementById('app-preloader')
        if (!el) return
        var hide = function () {
          el.classList.add('is-hidden')
          window.setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el)
          }, 500)
        }
        window.setTimeout(hide, 3000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
